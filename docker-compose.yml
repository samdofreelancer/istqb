version: '3.8'

services:
  backend:
    build:
      context: ./quiz-backend
      dockerfile: Dockerfile
    container_name: quiz-backend
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 2s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - quiz-app-network

  frontend:
    build:
      context: ./quiz-frontend
      dockerfile: Dockerfile
    container_name: quiz-frontend
    hostname: istqb-demo.127.0.0.1.nip.io
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quiz-app-network

networks:
  quiz-app-network:
    driver: bridge
