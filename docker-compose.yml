version: '3.8'

services:
  backend:
    image: ghcr.io/${GITHUB_REPOSITORY:-samdofreelancer/istqb}-backend:${TAG:-latest}
    build:
      context: ./quiz-backend
      dockerfile: Dockerfile
    container_name: quiz-backend
    ports:
      - "8081:8081"
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/actuator/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - quiz-app-network

  frontend:
    image: ghcr.io/${GITHUB_REPOSITORY:-samdofreelancer/istqb}-frontend:${TAG:-latest}
    build:
      context: ./quiz-frontend
      dockerfile: Dockerfile
    container_name: quiz-frontend
    ports:
      - "80:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - quiz-app-network

networks:
  quiz-app-network:
    driver: bridge
